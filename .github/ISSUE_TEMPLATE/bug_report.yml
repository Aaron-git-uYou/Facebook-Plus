name: 🐞 Bug report
description: Report something that is broken or not behaving as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please fill in as much as you can — the version and diagnostics fields make issues far faster to resolve.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched the [existing issues](../issues?q=is%3Aissue) and did not find a duplicate.
          required: true
        - label: I am running the latest release of Facebook Plus.
          required: true
        - label: This is a problem with the tweak, not with the Facebook app itself.
          required: true

  - type: dropdown
    id: install-type
    attributes:
      label: How is it installed?
      description: |
        On a jailbreak, just pick the first option. When sideloaded, the signing certificate matters — a personal certificate strips entitlements the sideload compatibility layer has to repair, so login/keychain/data bugs often depend on this.
      options:
        - Jailbroken (.deb)
        - Non-jailbroken — public certificate
        - Non-jailbroken — personal certificate
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: Affected feature
      description: Which part of the tweak is involved?
      options:
        - Feed (ads / recommendations / suggestions / Threads promo)
        - Reels
        - Stories (anonymous viewing / auto-advance)
        - Like confirmation
        - Appearance — OLED dark mode
        - Appearance — App icon
        - Language
        - Meta Facebook Plus (subscription preview)
        - Settings UI / gesture
        - Sideload compatibility (login, keychain, data)
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what is wrong.
      placeholder: When I open a story, …
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the problem.
      placeholder: |
        1. Open the settings (long-press a tab bar item)
        2. Enable …
        3. Scroll the feed
        4. See …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: "iOS 16.5"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "iPhone 13"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics export
      description: |
        Open **Settings → Diagnostics**, browse to the affected screen first (Feed, Reels, a story), then use **Share** to export the log and paste it here. This is the single most useful thing for diagnosing "a feature isn't showing".
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, or anything else that helps.
